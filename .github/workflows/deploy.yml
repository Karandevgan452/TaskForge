name: TaskForge CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - '*'

jobs:
  ci-test:
    name: 1. CI - Continuous Integration & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install

      - name: Make Scripts Executable
        run: |
          chmod +x ./mvnw
          chmod +x ./run-tests.sh

      - name: Run Automated Test Suite
        run: ./run-tests.sh

  cd-deploy:
    name: 2. CD - Migration, Build, Version-Tagged Docker Push & Render Deployment
    runs-on: ubuntu-latest
    needs: ci-test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install

      - name: Run Prisma DB Migration in CD Pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npx prisma generate
          npx prisma migrate deploy || npx prisma db push

      - name: Build Maven Application Artifact (JAR)
        run: |
          chmod +x ./mvnw
          ./mvnw clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Git Release Tag Name
        id: vars
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
          echo "Extracted Git Tag: ${TAG_NAME}"

      - name: Build and Push Version-Tagged Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/taskforge:${{ env.TAG_NAME }}

      - name: Deploy Exact Version-Tagged Image to Render
        run: |
          IMAGE_TAG_CANONICAL="docker.io/${{ secrets.DOCKER_USERNAME }}/taskforge:${{ env.TAG_NAME }}"
          IMAGE_TAG_SHORT="${{ secrets.DOCKER_USERNAME }}/taskforge:${{ env.TAG_NAME }}"
          BASE_URL="${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          
          if [[ "$BASE_URL" == *"?"* ]]; then
            PARAM_SEP="&"
          else
            PARAM_SEP="?"
          fi

          echo "Attempting Render deployment for tag: ${{ env.TAG_NAME }}"

          # Attempt 1: Canonical docker.io URL
          DEPLOY_URL_1="${BASE_URL}${PARAM_SEP}imgUrl=${IMAGE_TAG_CANONICAL}"
          echo "Trying deploy hook with canonical URL: ${DEPLOY_URL_1}"
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$DEPLOY_URL_1")
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 201 ] || [ "$HTTP_STATUS" -eq 202 ]; then
            echo "Render deployment triggered successfully with canonical tag! Status: $HTTP_STATUS"
            echo "Response: $BODY"
            exit 0
          fi

          echo "Canonical URL attempt returned status $HTTP_STATUS: $BODY"

          # Attempt 2: Short image URL
          DEPLOY_URL_2="${BASE_URL}${PARAM_SEP}imgUrl=${IMAGE_TAG_SHORT}"
          echo "Trying deploy hook with short URL: ${DEPLOY_URL_2}"
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$DEPLOY_URL_2")
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 201 ] || [ "$HTTP_STATUS" -eq 202 ]; then
            echo "Render deployment triggered successfully with short image tag! Status: $HTTP_STATUS"
            echo "Response: $BODY"
            exit 0
          fi

          echo "Short URL attempt returned status $HTTP_STATUS: $BODY"

          # Attempt 3: Standard Base Deploy Hook URL
          echo "Trying standard base deploy hook URL: ${BASE_URL}"
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$BASE_URL")
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 201 ] || [ "$HTTP_STATUS" -eq 202 ]; then
            echo "Render base deployment hook triggered successfully! Status: $HTTP_STATUS"
            echo "Response: $BODY"
            exit 0
          fi

          echo "Error: All Render deployment attempts failed. Final status: $HTTP_STATUS, body: $BODY"
          exit 1
