name: TaskForge CI/CD Pipeline

on:
  push:
    tags:
      - 'v*'

jobs:
  ci-test:
    name: 1. CI - Continuous Integration & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install

      - name: Make Scripts Executable
        run: |
          chmod +x ./mvnw
          chmod +x ./run-tests.sh

      - name: Run Automated Test Suite
        run: ./run-tests.sh

  cd-deploy:
    name: 2. CD - Migration, Build, Version-Tagged Docker Push & Render Deployment
    runs-on: ubuntu-latest
    needs: ci-test
    env:
      DOCKER_REPO: taskforge
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install

      - name: Run Prisma DB Migration in CD Pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npx prisma generate
          npx prisma migrate deploy || npx prisma db push

      - name: Build Maven Application Artifact (JAR)
        run: |
          chmod +x ./mvnw
          ./mvnw clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Find Version Tag and Prepare Image Name
        run: |
          VERSION_TAG=$(git tag --points-at HEAD | grep '^v' | head -n 1)
          if [ -z "$VERSION_TAG" ]; then
            VERSION_TAG="${GITHUB_REF#refs/tags/}"
          fi

          if [ -z "$VERSION_TAG" ]; then
            echo "❌ No version tag (v*) found for this commit!"
            exit 1
          fi

          IMAGE="docker.io/${{ secrets.DOCKER_USERNAME }}/${DOCKER_REPO}:${VERSION_TAG}"
          echo "VERSION_TAG=$VERSION_TAG" >> $GITHUB_ENV
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          echo "Extracted Version Tag: $VERSION_TAG"
          echo "Target Image: $IMAGE"

      - name: Build and Push Docker Image
        run: |
          echo "Building and Pushing Docker Image..."
          docker build -f Dockerfile -t "${{ env.IMAGE }}" .
          docker push "${{ env.IMAGE }}"
          echo "✅ Docker Image pushed successfully: ${{ env.IMAGE }}"

      - name: Trigger Render Deployment Hook
        run: |
          echo "🚀 Triggering Render deployment for image: ${{ env.IMAGE }}..."
          
          # URL-encode the image URL completely (handling slashes, colons, etc.)
          ENCODED_IMAGE=$(python3 -c "import urllib.parse; print(urllib.parse.quote('${{ env.IMAGE }}', safe=''))")
          
          # Determine proper query parameter separator
          if [[ "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" == *\?* ]]; then
            SEPARATOR="&"
          else
            SEPARATOR="?"
          fi

          MASKED_URL=$(echo "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" | sed 's/key=[^&]*/key=**redacted**/g')
          echo "Calling deploy hook: ${MASKED_URL}${SEPARATOR}imgURL=${ENCODED_IMAGE}"

          # Call Render deploy webhook with imgURL parameter
          RESPONSE=$(curl -sS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}${SEPARATOR}imgURL=${ENCODED_IMAGE}" \
            -w "\n%{http_code}")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          
          echo "Response Body: $BODY"
          echo "HTTP Status Code: $HTTP_CODE"
          
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "202" ]; then
            echo "✅ Render deployment triggered successfully!"
          else
            echo "❌ Failed to trigger Render deployment"
            echo "HTTP Status: $HTTP_CODE"
            echo "Response: $BODY"
            exit 1
          fi
