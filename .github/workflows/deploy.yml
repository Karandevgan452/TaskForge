name: TaskForge CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - '*'

jobs:
  ci-test:
    name: 1. CI - Continuous Integration & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install

      - name: Make Scripts Executable
        run: |
          chmod +x ./mvnw
          chmod +x ./run-tests.sh

      - name: Run Automated Test Suite
        run: ./run-tests.sh

  cd-deploy:
    name: 2. CD - Migration, Build, Version-Tagged Docker Push & Render Deployment
    runs-on: ubuntu-latest
    needs: ci-test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install

      - name: Run Prisma DB Migration in CD Pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npx prisma generate
          npx prisma migrate deploy || npx prisma db push

      - name: Build Maven Application Artifact (JAR)
        run: |
          chmod +x ./mvnw
          ./mvnw clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Git Release Tag Name
        id: vars
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
          echo "Extracted Git Tag: ${TAG_NAME}"

      - name: Build and Push Version-Tagged Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/taskforge-api:${{ env.TAG_NAME }}

      - name: Deploy Exact Version-Tagged Image to Render
        run: |
          IMAGE_TAG="docker.io/${{ secrets.DOCKER_USERNAME }}/taskforge-api:${{ env.TAG_NAME }}"
          echo "Deploying specific version tag to Render: ${IMAGE_TAG}"
          
          if [[ "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" == *"?"* ]]; then
            DEPLOY_URL="${{ secrets.RENDER_DEPLOY_HOOK_URL }}&imgUrl=${IMAGE_TAG}"
          else
            DEPLOY_URL="${{ secrets.RENDER_DEPLOY_HOOK_URL }}?imgUrl=${IMAGE_TAG}"
          fi
          
          curl -X POST "$DEPLOY_URL"
          echo ""
          echo "Render deployment triggered successfully for version tag ${env.TAG_NAME}!"
